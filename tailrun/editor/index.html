<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Remote text editor · Tailrun</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%232563eb'/%3E%3Cpath d='m8 10 7 6-7 6m10 0h6' fill='none' stroke='white' stroke-width='3' stroke-linecap='round'/%3E%3C/svg%3E">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.6/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.css" rel="stylesheet">
  <link rel="stylesheet" href="../style.css">
</head>
<body>
  <nav class="navbar navbar-expand-lg bg-body-tertiary mb-4" data-bs-theme="dark"><div class="container">
    <a class="navbar-brand d-flex align-items-center" href="../"><i class="bi bi-terminal me-2"></i>Tailrun</a>
    <div class="d-flex align-items-center gap-3"><a class="link-light small" href="../">Jobs</a><a class="link-light small" href="../youtube/">YouTube MP3</a><div class="bootstrap-dark-theme"></div></div>
  </div></nav>
  <main class="container pb-5">
    <header class="mb-3">
      <h1 class="fs-3"><i class="bi bi-file-earmark-text me-2"></i>Remote text editor</h1>
      <p>Edit a text file on your own computer. Browse folders, select a file, and save it. If another program changes the file, Tailrun will warn you before saving.</p>
    </header>
    <p id="error" class="alert alert-danger" role="alert"></p>
    <div class="input-group mb-2"><input class="form-control" id="path" aria-label="Folder or file path" placeholder="~/Dropbox/notes"><button class="btn btn-outline-secondary" id="connect">Connect</button><button class="btn btn-primary" id="open">Open path</button></div>
    <div id="roots" class="d-flex gap-2 flex-wrap mb-3"></div>
    <div class="row g-3">
      <section class="col-12 col-lg-4"><div class="card h-100"><div class="card-header fw-semibold">Files</div><ul class="list-group list-group-flush" id="items"></ul></div></section>
      <section class="col-12 col-lg-8"><div class="card"><div class="card-body">
        <h2 id="filetitle" class="fs-6 file-path">Choose a text file</h2>
        <p id="status" class="small text-secondary" role="status"></p>
        <textarea id="content" class="form-control" spellcheck="false" aria-label="Text file contents"></textarea>
        <div class="d-flex gap-2 flex-wrap mt-3">
          <button class="btn btn-primary" id="save" disabled><i class="bi bi-floppy me-1"></i>Save</button>
          <button class="btn btn-outline-secondary" id="reload" disabled>Reload</button>
          <button class="btn btn-outline-secondary" id="new">New file at path</button>
        </div>
      </div></div></section>
    </div>
  </main>
  <script type="module" src="script.js"></script>
</body>
</html>
