<!doctype html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Live Poll</title>
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg%20xmlns%3D%22http%3A%2F%2Fwww.w3.org%2F2000%2Fsvg%22%20viewBox%3D%220%200%2064%2064%22%3E%3Crect%20width%3D%2264%22%20height%3D%2264%22%20fill%3D%22oklch(0.55%200.2%20150)%22%20rx%3D%2212%22%2F%3E%3Crect%20x%3D%2212%22%20y%3D%2236%22%20width%3D%2210%22%20height%3D%2216%22%20fill%3D%22%23fff%22%2F%3E%3Crect%20x%3D%2227%22%20y%3D%2216%22%20width%3D%2210%22%20height%3D%2236%22%20fill%3D%22%23fff%22%2F%3E%3Crect%20x%3D%2242%22%20y%3D%2226%22%20width%3D%2210%22%20height%3D%2226%22%20fill%3D%22%23fff%22%2F%3E%3C%2Fsvg%3E" />
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.6/dist/css/bootstrap.min.css" rel="stylesheet" crossorigin="anonymous" />
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.css" crossorigin="anonymous" />
  <style>
    .question-input { font-size: clamp(2rem, 4.5vw, 4.5rem); font-weight: 700; line-height: 1.15; resize: none; overflow: hidden; border: 0; border-bottom: 2px dashed var(--bs-border-color); border-radius: 0; background: transparent; padding: .25rem 0 }
    .question-input:focus { box-shadow: none; border-bottom-color: var(--bs-primary) }
    .choice-input { font-size: clamp(1.25rem, 2.2vw, 2.25rem); font-weight: 600 }
    .bar { height: 2.25rem; font-size: 1.25rem; transition: none }
    .bar .progress-bar { transition: width .4s ease }
    .tally { font-size: clamp(2rem, 4vw, 4rem); font-weight: 800; font-variant-numeric: tabular-nums; line-height: 1 }
    .qr-box svg { width: 100%; height: auto; display: block; background: #fff; padding: 12px; border-radius: .5rem }
    .qr-small svg { width: 140px; height: auto; background: #fff; padding: 6px; border-radius: .25rem }
    .sticky-qr { position: sticky; top: 1rem }
    .live-dot { width: .7rem; height: .7rem; border-radius: 50%; display: inline-block; background: var(--bs-secondary) }
    .live-dot.live { background: var(--bs-success) }
    .vote-btn { font-size: 1.5rem; padding: 1rem; font-weight: 600; overflow-wrap: anywhere }
    .participant-question { font-size: clamp(1.5rem, 6vw, 2.5rem); font-weight: 700; overflow-wrap: anywhere; white-space: pre-wrap }
  </style>
</head>

<body>
  <nav class="navbar navbar-expand-lg bg-body-tertiary mb-4" data-bs-theme="dark">
    <div class="container">
      <a class="navbar-brand d-flex align-items-center" href="../">
        <i class="bi bi-bar-chart-fill me-2"></i>
        Live Poll
      </a>
      <span class="navbar-text small ms-auto me-3" id="net-status" hidden>
        <span class="live-dot me-1" id="net-dot"></span><span id="net-text">Connecting</span>
      </span>
      <div class="bootstrap-dark-theme"></div>
    </div>
  </nav>

  <main class="container pb-5" id="app">
    <div class="text-center my-5" id="loading">
      <div class="spinner-border" role="status"><span class="visually-hidden">Loading…</span></div>
    </div>
  </main>

  <!-- Only one of these templates is instantiated. The presenter template is cloned only in the browser that holds the room's signing key. -->
  <template id="landing-template">
    <div class="row justify-content-center">
      <div class="col-lg-7">
        <h1 class="display-5 fw-bold">Live Poll</h1>
        <p class="lead">Ask a question on the big screen. Everyone scans a QR code and votes from their phone. Save results to a TSV file.</p>
        <div class="card mb-4">
          <div class="card-body">
            <h2 class="h5">Present</h2>
            <p class="text-secondary">Creates a room whose presenter controls work only in this browser.</p>
            <button class="btn btn-primary btn-lg" id="create"><i class="bi bi-easel me-2"></i>Create a room</button>
          </div>
        </div>
        <div class="card">
          <div class="card-body">
            <h2 class="h5">Join</h2>
            <form class="d-flex gap-2" id="join-form">
              <input class="form-control form-control-lg text-uppercase" id="join-code" placeholder="Room code" autocomplete="off" aria-label="Room code" maxlength="12" />
              <button class="btn btn-outline-primary btn-lg" type="submit">Join</button>
            </form>
          </div>
        </div>
      </div>
    </div>
  </template>

  <template id="presenter-template">
    <div class="row g-4">
      <div class="col-lg-8">
        <div class="d-flex flex-wrap gap-2 mb-3 align-items-center">
          <button class="btn btn-primary" id="new" title="Save this question and start a new one"><i class="bi bi-plus-lg me-1"></i>New</button>
          <button class="btn btn-outline-primary" id="save" title="Save this question's results to a TSV file"><i class="bi bi-floppy me-1"></i>Save</button>
          <button class="btn btn-outline-secondary" id="reveal" title="Show or hide results (R)"><i class="bi bi-bar-chart me-1"></i><span>Show results</span> <kbd>R</kbd></button>
          <button class="btn btn-outline-secondary" id="history-toggle" title="Past questions (only you see this)" aria-expanded="false" aria-controls="history" hidden><i class="bi bi-clock-history me-1"></i>Past <span class="badge text-bg-secondary" id="history-count">0</span></button>
          <div class="vr mx-1"></div>
          <button class="btn btn-outline-secondary" id="pick-file" title="Update an existing TSV"><i class="bi bi-file-earmark-spreadsheet me-1"></i><span>Open TSV…</span></button>
          <input type="file" id="import-file" accept=".tsv,text/tab-separated-values" hidden />
          <span class="small text-secondary" id="file-status">No file chosen</span>
          <span class="spinner-border spinner-border-sm" id="saving" role="status" hidden><span class="visually-hidden">Saving…</span></span>
        </div>
        <div id="new-failed"></div>
        <div class="list-group mb-3" id="history" hidden></div>
        <div id="viewing" hidden><div class="alert alert-info d-flex flex-wrap gap-2 align-items-center">
          <span class="me-auto"><i class="bi bi-clock-history me-2"></i><span id="viewing-source">Past question</span>. Participants still see the current one (<span id="viewing-tally"></span> responded).</span>
          <button class="btn btn-sm btn-primary" id="show-past" title="Save the current question and make this one live again">Show to participants</button>
          <button class="btn btn-sm btn-outline-secondary" id="back-current">Back to current</button>
        </div></div>
        <textarea class="form-control question-input mb-4" id="question" rows="1" placeholder="Type your question…" aria-label="Question"></textarea>
        <div id="choices" class="d-flex flex-column gap-3 mb-3"></div>
        <button class="btn btn-outline-secondary mb-4" id="add-choice"><i class="bi bi-plus-circle me-1"></i>Add choice</button>
        <div class="d-flex flex-wrap gap-5 align-items-end">
          <div><div class="tally" id="tally">0 / 0</div><div class="text-secondary">responded</div></div>
          <div class="text-secondary small" id="voting-state"></div>
        </div>
      </div>
      <div class="col-lg-4">
        <div class="sticky-qr text-center">
          <div class="qr-box mb-2" id="qr"></div>
          <div class="fs-3 fw-bold font-monospace" id="room-code"></div>
          <a class="small text-break" id="join-link" target="_blank" rel="noopener"></a>
        </div>
      </div>
    </div>
  </template>

  <template id="participant-template">
    <div class="row justify-content-center">
      <div class="col-md-8 col-lg-6">
        <div class="participant-question mb-4" id="p-question"></div>
        <div class="alert alert-warning" id="p-revote" hidden><i class="bi bi-exclamation-triangle me-2"></i>The choice you picked was removed. Please vote again.</div>
        <div class="d-grid gap-3 mb-4" id="p-choices"></div>
        <div class="d-flex justify-content-between align-items-center text-secondary">
          <span id="p-mine"></span>
          <span><strong class="fs-4" id="p-tally">0 / 0</strong> responded</span>
        </div>
        <div class="text-center mt-5 text-secondary small">
          <div class="qr-small mb-1" id="p-qr"></div>
          Room <span class="font-monospace" id="p-room"></span>
        </div>
      </div>
    </div>
  </template>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.6/dist/js/bootstrap.bundle.min.js" crossorigin="anonymous"></script>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap-dark-theme@1" type="module"></script>
  <script type="module" src="script.js"></script>
</body>

</html>
