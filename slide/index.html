<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Slide Editor</title>
  <link id="favicon" rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg%20xmlns%3D%22http%3A%2F%2Fwww.w3.org%2F2000%2Fsvg%22%20viewBox%3D%220%200%2064%2064%22%3E%3Crect%20width%3D%2264%22%20height%3D%2264%22%20fill%3D%22oklch(0.5%200.3%20225)%22%20rx%3D%2212%22%2F%3E%3Ctext%20x%3D%2232%22%20y%3D%2248%22%20fill%3D%22%23fff%22%20font-family%3D%22sans-serif%22%20font-size%3D%2252%22%20font-weight%3D%22900%22%20text-anchor%3D%22middle%22%3ES%3C%2Ftext%3E%3C%2Fsvg%3E" />
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
      overflow: hidden;
    }

    #slide-container {
      width: 100vw;
      height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      position: relative;
      transition: background-color 0.3s ease;
      background-size: cover;
      background-position: center;
      background-repeat: no-repeat;
    }

    #slide-container::before {
      content: '';
      position: absolute;
      top: 0;
      left: 0;
      right: 0;
      bottom: 0;
      background: inherit;
      z-index: 0;
    }

    #content {
      position: relative;
      z-index: 1;
      text-align: center;
      padding: 2rem;
      max-width: 90%;
    }

    #title {
      font-weight: 700;
      margin-bottom: 1.5rem;
      line-height: 1.2;
      transition: all 0.3s ease;
    }

    #subtitle {
      font-weight: 400;
      line-height: 1.4;
      transition: all 0.3s ease;
    }

    #edit-icon {
      position: absolute;
      top: 20px;
      right: 20px;
      width: 40px;
      height: 40px;
      cursor: pointer;
      opacity: 0.1;
      transition: opacity 0.3s ease;
      z-index: 100;
      background: rgba(0, 0, 0, 0.1);
      border-radius: 8px;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    #edit-icon:hover {
      opacity: 0.8;
    }

    #edit-icon svg {
      width: 24px;
      height: 24px;
      fill: currentColor;
    }

    #modal {
      display: none;
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      background: rgba(0, 0, 0, 0.7);
      z-index: 1000;
      align-items: center;
      justify-content: center;
    }

    #modal.show {
      display: flex;
    }

    #modal-content {
      background: white;
      border-radius: 12px;
      padding: 1.5rem 1.75rem;
      width: 90%;
      max-width: 620px;
      max-height: 90vh;
      overflow-y: auto;
      box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
    }

    .modal-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 1rem;
      margin-bottom: 1rem;
    }

    .modal-header h2 {
      font-size: 1.4rem;
      margin: 0;
    }

    #theme-select {
      width: auto;
      max-width: 45%;
      padding: 0.4rem 0.6rem;
      border: 1px solid #ddd;
      border-radius: 6px;
      font-size: 0.9rem;
      font-family: inherit;
      background: #f8f9fa;
      cursor: pointer;
    }

    .form-group {
      margin-bottom: 0.85rem;
    }

    #subtitle-input {
      min-height: 0;
      height: 3rem;
    }

    .form-group label {
      display: block;
      margin-bottom: 0.4rem;
      font-weight: 600;
      color: #333;
    }

    .form-row {
      display: flex;
      gap: 1rem;
    }

    .form-row > .form-group {
      flex: 1;
      min-width: 0;
    }

    .slider-inline {
      display: flex;
      align-items: center;
      gap: 0.75rem;
    }

    .slider-inline label {
      margin-bottom: 0;
      white-space: nowrap;
    }

    .slider-inline .value {
      font-weight: 600;
      color: #333;
      font-size: 0.9rem;
      min-width: 3.2rem;
      text-align: right;
    }

    .slider-inline input[type="range"] {
      flex: 1;
    }

    #title-input {
      min-height: 0;
      height: 2.75rem;
      resize: vertical;
    }

    .form-group input[type="text"],
    .form-group textarea,
    .form-group select {
      width: 100%;
      padding: 0.75rem;
      border: 1px solid #ddd;
      border-radius: 6px;
      font-size: 1rem;
      font-family: inherit;
    }

    .form-group textarea {
      resize: vertical;
      min-height: 80px;
    }

    .color-input-group {
      display: flex;
      gap: 1rem;
      align-items: center;
    }

    .color-input-group input[type="color"] {
      width: 60px;
      height: 40px;
      border: 1px solid #ddd;
      border-radius: 6px;
      cursor: pointer;
    }

    .color-input-group input[type="text"] {
      flex: 1;
    }

    .slider-group {
      display: flex;
      flex-direction: column;
      gap: 0.5rem;
    }

    .slider-display {
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 0.9rem;
      color: #666;
    }

    .slider-display .value {
      font-weight: 600;
      color: #333;
    }

    input[type="range"] {
      width: 100%;
      height: 6px;
      border-radius: 3px;
      background: #ddd;
      outline: none;
      -webkit-appearance: none;
    }

    input[type="range"]::-webkit-slider-thumb {
      -webkit-appearance: none;
      appearance: none;
      width: 20px;
      height: 20px;
      border-radius: 50%;
      background: #007bff;
      cursor: pointer;
    }

    input[type="range"]::-moz-range-thumb {
      width: 20px;
      height: 20px;
      border-radius: 50%;
      background: #007bff;
      cursor: pointer;
      border: none;
    }

    .button-group {
      display: flex;
      gap: 1rem;
      margin-top: 1rem;
    }

    button {
      padding: 0.75rem 1.5rem;
      border: none;
      border-radius: 6px;
      font-size: 1rem;
      cursor: pointer;
      font-weight: 600;
      transition: background-color 0.2s ease;
    }

    button.primary {
      background: #007bff;
      color: white;
      flex: 1;
    }

    button.primary:hover {
      background: #0056b3;
    }

    button.secondary {
      background: #6c757d;
      color: white;
    }

    button.secondary:hover {
      background: #545b62;
    }

    .hint {
      font-size: 0.85rem;
      color: #666;
      margin-top: 0.25rem;
    }

  </style>
</head>

<body>
  <div id="slide-container">
    <div id="edit-icon">
      <svg viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
        <path d="M3 17.25V21h3.75L17.81 9.94l-3.75-3.75L3 17.25zM20.71 7.04c.39-.39.39-1.02 0-1.41l-2.34-2.34c-.39-.39-1.02-.39-1.41 0l-1.83 1.83 3.75 3.75 1.83-1.83z" />
      </svg>
    </div>
    <div id="content">
      <h1 id="title"></h1>
      <h2 id="subtitle"></h2>
    </div>
  </div>

  <div id="modal">
    <div id="modal-content">
      <div class="modal-header">
        <h2>Edit Slide</h2>
        <select id="theme-select" title="Apply a pre-designed theme">
          <option value="">Theme…</option>
        </select>
      </div>

      <div class="form-group">
        <label for="title-input">Title (Markdown)</label>
        <textarea id="title-input" rows="1" placeholder="Enter slide title"></textarea>
      </div>

      <div class="form-group">
        <label for="subtitle-input">Subtitle (Markdown)</label>
        <textarea id="subtitle-input" rows="2" placeholder="Enter slide subtitle"></textarea>
      </div>

      <div class="form-row">
        <div class="form-group">
          <label for="title-font-select">Title Font</label>
          <select id="title-font-select"></select>
        </div>
        <div class="form-group">
          <label for="subtitle-font-select">Subtitle Font</label>
          <select id="subtitle-font-select"></select>
        </div>
      </div>

      <div class="form-group slider-inline">
        <label for="title-scale-slider">Title Size</label>
        <span class="value" id="title-scale-display">100%</span>
        <input type="range" id="title-scale-slider" min="-20" max="20" step="0.1" value="0">
      </div>

      <div class="form-group slider-inline">
        <label for="subtitle-scale-slider">Subtitle Size</label>
        <span class="value" id="subtitle-scale-display">100%</span>
        <input type="range" id="subtitle-scale-slider" min="-20" max="20" step="0.1" value="0">
      </div>

      <div class="form-row">
        <div class="form-group">
          <label for="fg-color">Foreground Color</label>
          <div class="color-input-group">
            <input type="color" id="fg-color" value="#ffffff">
            <input type="text" id="fg-color-text" value="#ffffff">
          </div>
        </div>
        <div class="form-group">
          <label for="bg-color">Background Color</label>
          <div class="color-input-group">
            <input type="color" id="bg-color" value="#1a1a2e">
            <input type="text" id="bg-color-text" value="#1a1a2e">
          </div>
        </div>
      </div>

      <div class="form-group">
        <label for="bg-search">Background Image URL</label>
        <input type="text" id="bg-search" placeholder="Paste image URL (e.g., https://images.unsplash.com/...)">
        <div class="hint">Leave empty for solid background color. Try <a href="https://unsplash.com" target="_blank">Unsplash</a>, <a href="https://www.pexels.com" target="_blank">Pexels</a>, or any image URL</div>
      </div>

      <div class="button-group">
        <button class="secondary" id="close-modal">Close</button>
      </div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
  <script>
    // Available fonts (shared by title & subtitle selectors)
    const FONTS = [
      'Montserrat', 'Roboto', 'Open Sans', 'Lato', 'Raleway', 'Poppins',
      'Playfair Display', 'Merriweather', 'Oswald', 'Source Sans Pro', 'Nunito', 'Inter'
    ];
    // Pre-designed themes (fonts, sizes, colors, background images)
    const THEMES = {
      keynote: {
        label: 'Keynote (Jobs)',
        titleFont: 'Inter', subtitleFont: 'Inter',
        titleScale: 3, subtitleScale: -1,
        fgColor: '#ffffff', bgColor: '#000000', bgSearch: ''
      },
      minimal: {
        label: 'Minimalist',
        titleFont: 'Inter', subtitleFont: 'Inter',
        titleScale: 1, subtitleScale: -3,
        fgColor: '#111111', bgColor: '#ffffff', bgSearch: ''
      },
      editorial: {
        label: 'Editorial',
        titleFont: 'Playfair Display', subtitleFont: 'Merriweather',
        titleScale: 2, subtitleScale: -2,
        fgColor: '#2b2b2b', bgColor: '#f4efe6', bgSearch: ''
      },
      corporate: {
        label: 'Corporate Blue',
        titleFont: 'Source Sans Pro', subtitleFont: 'Source Sans Pro',
        titleScale: 2, subtitleScale: -1,
        fgColor: '#ffffff', bgColor: '#0f2a47', bgSearch: ''
      },
      poster: {
        label: 'Flame',
        titleFont: 'Oswald', subtitleFont: 'Montserrat',
        titleScale: 4, subtitleScale: -1,
        fgColor: '#ffffff', bgColor: '#d62828', bgSearch: 'https://images.pexels.com/photos/7605676/pexels-photo-7605676.jpeg'
      },
      cosmos: {
        label: 'Cosmos',
        titleFont: 'Montserrat', subtitleFont: 'Montserrat',
        titleScale: 2, subtitleScale: -1,
        fgColor: '#ffffff', bgColor: '#060b18',
        bgSearch: 'https://images.unsplash.com/photo-1451187580459-43490279c0fa?auto=format&fit=crop&w=1920&q=80'
      },
      summit: {
        label: 'Summit',
        titleFont: 'Poppins', subtitleFont: 'Poppins',
        titleScale: 2, subtitleScale: -1,
        fgColor: '#ffffff', bgColor: '#1a1a2e',
        bgSearch: 'https://images.unsplash.com/photo-1506905925346-21bda4d32df4?auto=format&fit=crop&w=1920&q=80'
      }
    };
    // Default values
    const defaults = {
      title: '# Welcome to Your Slide',
      subtitle: 'A beautiful presentation starts here',
      titleFont: 'Montserrat',
      subtitleFont: 'Montserrat',
      titleScale: 0,
      subtitleScale: 0,
      fgColor: '#ffffff',
      bgColor: '#1a1a2e',
      bgSearch: ''
    };
    let loadedFonts = new Set();
    // Populate font selectors and theme dropdown
    function populateSelectors() {
      const options = FONTS.map((f) => `<option value="${f}">${f}</option>`).join('');
      document.getElementById('title-font-select').innerHTML = options;
      document.getElementById('subtitle-font-select').innerHTML = options;
      const themeSelect = document.getElementById('theme-select');
      themeSelect.innerHTML = '<option value="">Theme…</option>' +
        Object.entries(THEMES).map(([key, t]) => `<option value="${key}">${t.label}</option>`).join('');
    }
    populateSelectors();
    // Parse URL hash parameters
    function parseHash() {
      const hash = window.location.hash.slice(1);
      if (!hash) return {
        ...defaults
      };
      const params = new URLSearchParams(hash);
      const legacyScale = parseFloat(params.get('scale') || defaults.titleScale);
      const legacyFont = params.get('font');
      return {
        title: params.get('title') || defaults.title,
        subtitle: params.get('subtitle') || defaults.subtitle,
        titleFont: params.get('titleFont') || legacyFont || defaults.titleFont,
        subtitleFont: params.get('subtitleFont') || legacyFont || defaults.subtitleFont,
        titleScale: parseFloat(params.get('titleScale') || legacyScale),
        subtitleScale: parseFloat(params.get('subtitleScale') || legacyScale),
        fgColor: params.get('fgColor') || defaults.fgColor,
        bgColor: params.get('bgColor') || defaults.bgColor,
        bgSearch: params.get('bgSearch') || defaults.bgSearch
      };
    }
    // Update URL hash
    function updateHash(params) {
      const searchParams = new URLSearchParams();
      Object.entries(params).forEach(([key, value]) => {
        if (value !== '') {
          searchParams.set(key, value);
        }
      });
      window.location.hash = searchParams.toString();
    }
    // Calculate scale factor from slider value
    function calculateScale(value) {
      return Math.pow(1.1, value);
    }
    // Load Google Font
    function loadFont(fontName) {
      if (loadedFonts.has(fontName)) return;
      const link = document.createElement('link');
      link.href = `https://fonts.googleapis.com/css2?family=${fontName.replace(/ /g, '+')}:wght@400;700&display=swap`;
      link.rel = 'stylesheet';
      document.head.appendChild(link);
      loadedFonts.add(fontName);
    }
    // Render markdown
    function renderMarkdown(text) {
      return marked.parse(text);
    }
    // Convert markdown to plain text for document title
    function markdownToPlainText(text) {
      const temp = document.createElement('div');
      temp.innerHTML = renderMarkdown(text);
      return temp.textContent?.trim() || '';
    }

    function getFaviconLetter(text) {
      return text.match(/\p{L}/u)?.[0]?.toLocaleUpperCase() || 'S';
    }

    function getFaviconTextColor(color) {
      const hex = color.match(/^#?([\da-f]{3}|[\da-f]{6})$/i)?.[1];
      if (!hex) return '#fff';
      const normalized = hex.length === 3 ? [...hex].map((char) => char + char).join('') : hex;
      const red = parseInt(normalized.slice(0, 2), 16);
      const green = parseInt(normalized.slice(2, 4), 16);
      const blue = parseInt(normalized.slice(4, 6), 16);
      const brightness = (red * 299 + green * 587 + blue * 114) / 1000;
      return brightness > 160 ? '#111' : '#fff';
    }

    function updateFavicon(title, color) {
      const favicon = document.getElementById('favicon') || document.querySelector('link[rel="icon"]');
      if (!favicon) return;
      const letter = getFaviconLetter(title);
      const textColor = getFaviconTextColor(color);
      const svg = `<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64"><rect width="64" height="64" fill="${color}" rx="12"/><text x="32" y="48" fill="${textColor}" font-family="sans-serif" font-size="52" font-weight="900" text-anchor="middle">${letter}</text></svg>`;
      favicon.href = `data:image/svg+xml,${encodeURIComponent(svg)}`;
    }
    // Get background image URL
    async function getBackgroundImageUrl(input) {
      if (!input || input.trim() === '') {
        return null;
      }
      // If it's already a URL, return it directly
      if (input.startsWith('http://') || input.startsWith('https://')) {
        return input;
      }
      // Otherwise, return null (could add other providers here)
      return null;
    }
    // Apply slide configuration
    async function applyConfig(config) {
      const {
        title,
        subtitle,
        titleFont,
        subtitleFont,
        titleScale,
        subtitleScale,
        fgColor,
        bgColor,
        bgSearch
      } = config;
      // Load fonts
      loadFont(titleFont);
      loadFont(subtitleFont);
      // Calculate and apply scale
      const baseTitleSize = 4; // rem
      const baseSubtitleSize = 2; // rem
      const titleElement = document.getElementById('title');
      const subtitleElement = document.getElementById('subtitle');
      // Apply fonts independently
      titleElement.style.fontFamily = `'${titleFont}', sans-serif`;
      subtitleElement.style.fontFamily = `'${subtitleFont}', sans-serif`;
      titleElement.style.fontSize = `${baseTitleSize * calculateScale(titleScale)}rem`;
      subtitleElement.style.fontSize = `${baseSubtitleSize * calculateScale(subtitleScale)}rem`;
      // Apply colors
      titleElement.style.color = fgColor;
      subtitleElement.style.color = fgColor;
      document.getElementById('edit-icon').style.color = fgColor;
      // Apply content
      titleElement.innerHTML = renderMarkdown(title);
      subtitleElement.innerHTML = renderMarkdown(subtitle);
      const plainTitle = markdownToPlainText(title);
      const plainSubtitle = markdownToPlainText(subtitle);
      const tabTitle = plainTitle || plainSubtitle;
      document.title = tabTitle ? `${tabTitle} - Slide Editor` : 'Slide Editor';
      updateFavicon(plainTitle, bgColor);
      // Apply background
      const container = document.getElementById('slide-container');
      if (bgSearch && bgSearch.trim() !== '') {
        const imageUrl = await getBackgroundImageUrl(bgSearch);
        if (imageUrl) {
          container.style.backgroundImage = `linear-gradient(rgba(0,0,0,0.3), rgba(0,0,0,0.3)), url(${imageUrl})`;
          container.style.backgroundColor = bgColor;
        } else {
          container.style.backgroundImage = 'none';
          container.style.backgroundColor = bgColor;
        }
      } else {
        container.style.backgroundImage = 'none';
        container.style.backgroundColor = bgColor;
      }
    }
    // Initialize form with current config
    function initForm(config) {
      document.getElementById('title-input').value = config.title;
      document.getElementById('subtitle-input').value = config.subtitle;
      document.getElementById('title-font-select').value = config.titleFont;
      document.getElementById('subtitle-font-select').value = config.subtitleFont;
      document.getElementById('title-scale-slider').value = config.titleScale;
      document.getElementById('subtitle-scale-slider').value = config.subtitleScale;
      document.getElementById('fg-color').value = config.fgColor;
      document.getElementById('fg-color-text').value = config.fgColor;
      document.getElementById('bg-color').value = config.bgColor;
      document.getElementById('bg-color-text').value = config.bgColor;
      document.getElementById('bg-search').value = config.bgSearch;
      updateScaleDisplay(config.titleScale, 'title-scale-display');
      updateScaleDisplay(config.subtitleScale, 'subtitle-scale-display');
    }
    // Update scale display
    function updateScaleDisplay(value, displayId) {
      const scale = calculateScale(value);
      const percentage = Math.round(scale * 100);
      document.getElementById(displayId).textContent = `${percentage}%`;
    }
    // Get current form values
    function getFormValues() {
      return {
        title: document.getElementById('title-input').value,
        subtitle: document.getElementById('subtitle-input').value,
        titleFont: document.getElementById('title-font-select').value,
        subtitleFont: document.getElementById('subtitle-font-select').value,
        titleScale: parseFloat(document.getElementById('title-scale-slider').value),
        subtitleScale: parseFloat(document.getElementById('subtitle-scale-slider').value),
        fgColor: document.getElementById('fg-color').value,
        bgColor: document.getElementById('bg-color').value,
        bgSearch: document.getElementById('bg-search').value
      };
    }
    // Update live
    function updateLive() {
      const config = getFormValues();
      updateHash(config);
      applyConfig(config);
    }
    // Event listeners
    document.getElementById('edit-icon').addEventListener('click', () => {
      const config = parseHash();
      initForm(config);
      document.getElementById('modal').classList.add('show');
    });
    document.getElementById('close-modal').addEventListener('click', () => {
      document.getElementById('modal').classList.remove('show');
    });
    document.getElementById('modal').addEventListener('click', (e) => {
      if (e.target === document.getElementById('modal')) {
        document.getElementById('modal').classList.remove('show');
      }
    });
    // Live updates
    document.getElementById('title-input').addEventListener('input', updateLive);
    document.getElementById('subtitle-input').addEventListener('input', updateLive);
    document.getElementById('title-font-select').addEventListener('change', updateLive);
    document.getElementById('subtitle-font-select').addEventListener('change', updateLive);
    // Theme dropdown: apply preset styling, keep existing title/subtitle text
    document.getElementById('theme-select').addEventListener('change', (e) => {
      const theme = THEMES[e.target.value];
      if (!theme) return;
      const config = getFormValues();
      const { label, ...styling } = theme;
      Object.assign(config, styling);
      initForm(config);
      updateLive();
    });
    document.getElementById('title-scale-slider').addEventListener('input', (e) => {
      updateScaleDisplay(e.target.value, 'title-scale-display');
      updateLive();
    });
    document.getElementById('subtitle-scale-slider').addEventListener('input', (e) => {
      updateScaleDisplay(e.target.value, 'subtitle-scale-display');
      updateLive();
    });
    // Color sync
    document.getElementById('fg-color').addEventListener('input', (e) => {
      document.getElementById('fg-color-text').value = e.target.value;
      updateLive();
    });
    document.getElementById('fg-color-text').addEventListener('input', (e) => {
      document.getElementById('fg-color').value = e.target.value;
      updateLive();
    });
    document.getElementById('bg-color').addEventListener('input', (e) => {
      document.getElementById('bg-color-text').value = e.target.value;
      updateLive();
    });
    document.getElementById('bg-color-text').addEventListener('input', (e) => {
      document.getElementById('bg-color').value = e.target.value;
      updateLive();
    });
    document.getElementById('bg-search').addEventListener('input', updateLive);
    // Handle hash changes (for bookmarking)
    window.addEventListener('hashchange', () => {
      const config = parseHash();
      applyConfig(config);
    });
    // Initialize
    const initialConfig = parseHash();
    applyConfig(initialConfig);

  </script>
</body>

</html>
